<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Carrikcare</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF3F1;--card:#fff;--ink:#14302F;--mut:#5d7472;--line:#d5e2df;--pri:#1B6F68;--pri2:#bfe3df;--warn:#B8740F;--warnbg:#fbeed5;--bad:#B3392F;--badbg:#f8ddd9;--ok:#2b7a4b;--okbg:#dcf0e3;--map:#e3ede9;--water:#c3dde3;--road:#fff;--park:#cfe6d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d1c;--card:#172a29;--ink:#e6f1ef;--mut:#9ab3b0;--line:#2a4240;--pri:#4fc0b5;--pri2:#2c5753;--warn:#f0b050;--warnbg:#3a2e14;--bad:#f08a80;--badbg:#3d1f1c;--ok:#6fd195;--okbg:#1a3a2a;--map:#1a2e2c;--water:#20444a;--road:#2c4745;--park:#1d3a30}}
:root[data-theme="dark"]{--bg:#0f1d1c;--card:#172a29;--ink:#e6f1ef;--mut:#9ab3b0;--line:#2a4240;--pri:#4fc0b5;--pri2:#2c5753;--warn:#f0b050;--warnbg:#3a2e14;--bad:#f08a80;--badbg:#3d1f1c;--ok:#6fd195;--okbg:#1a3a2a;--map:#1a2e2c;--water:#20444a;--road:#2c4745;--park:#1d3a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--ink);font:15px/1.4 Figtree,system-ui,sans-serif;padding:0 14px 90px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 0;z-index:5}
.brand{font:700 21px 'Bricolage Grotesque',sans-serif;color:var(--pri)}
#seg{display:flex;background:var(--line);border-radius:10px;padding:3px}
#seg button{border:0;background:none;color:var(--mut);padding:6px 12px;border-radius:8px;font:600 13px inherit;font-family:inherit}
#seg button.on{background:var(--card);color:var(--ink)}
h2{font:700 24px 'Bricolage Grotesque',sans-serif;margin:6px 0 10px}
h3{font:600 16px 'Bricolage Grotesque',sans-serif;margin:20px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
small{display:block;color:var(--mut);font-size:13px}
.chip{font-style:normal;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--mut)}
.chip.ok,.chip.accepted{background:var(--okbg);color:var(--ok)}
.chip.offered{background:var(--warnbg);color:var(--warn)}
.chip.bad,.chip.declined{background:var(--badbg);color:var(--bad)}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--pri);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;margin-top:12px}
.ghost,.mini{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px}
.mini{padding:5px 9px;font-size:12px}
.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{margin-top:0}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
select,input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
summary{font-weight:600;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:13px 2px;font-size:11.5px;font-weight:600}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.banner{border-radius:12px;padding:11px 14px;font-weight:600;margin-bottom:12px}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.okb{background:var(--okbg);color:var(--ok)}
.cert{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;margin-top:8px}
.cert>span{flex:1}
.map{width:100%;height:auto;border-radius:12px;display:block;margin:10px 0}
.lbl{font:600 10px Figtree,sans-serif;fill:var(--ink);stroke:var(--map);stroke-width:3px;paint-order:stroke}
.ax{font:9px Figtree,sans-serif;fill:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis .card{margin:0;padding:10px}.kpis b{font:700 18px 'Bricolage Grotesque',sans-serif;display:block}
.bar{height:7px;background:var(--line);border-radius:9px;margin:6px 0}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.chip.verified{background:var(--okbg);color:var(--ok)}.chip.live{background:var(--pri2);color:var(--pri)}.chip.signoff{background:var(--warnbg);color:var(--warn)}
canvas{width:100%;height:130px;border:1px dashed var(--mut);border-radius:10px;background:#fff;touch-action:none;display:block;margin-top:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<header><span class="brand">Carrikcare</span><div id="seg"></div></header>
<main id="main"></main><nav id="tabs"></nav><div id="toast"></div>
<script>
const CUR='£',$=s=>document.querySelector(s);
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const D=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return d};
const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const days=d=>Math.round((d-TODAY)/864e5);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const money=x=>CUR+Math.round(x).toLocaleString('en-GB');
const km=(a,b)=>{const r=x=>x*Math.PI/180,p=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 12742*Math.asin(Math.sqrt(p))};
const CERTS=['Background check','Manual handling','Basic life support','Medication competency'];
const TIMES={'Day 08:00–20:00':12,'Morning 08:00–14:00':6,'Afternoon 14:00–20:00':6,'Night 20:00–08:00':12,'Night 20:00–10:00':14};
const LBL={open:'Open',offered:'Awaiting reply',accepted:'Accepted',declined:'Declined',live:'On shift',signoff:'Needs home sign-off',verified:'Verified'};
const so=s=>s.sig?'verified':s.out?'signoff':s.in?'live':s.st;
const tm=ms=>new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const hrs=s=>{const e=(s.out-s.in)/36e5;return e>=1?Math.round(e*4)/4:TIMES[s.t]};
const CRIT=['Clinical knowledge','Attitude','Timekeeping','Relationship with colleagues','Relationships with service users','Communication skills'];
const RATE=['Excellent','Good','Satisfactory','Poor'];
let gps='sim-on',drew=false;
const bill=r=>r=='Nurse'?38:24;
const S=[{n:'Maple Court, Belfast',lat:54.597,lng:-5.930},{n:'Riverside Lodge, Lisburn',lat:54.512,lng:-6.046},{n:'Hollins House, Ballymena',lat:54.864,lng:-6.281},{n:"St Anne's Home, Newry",lat:54.176,lng:-6.339},{n:'Oakfield Care, Derry',lat:54.996,lng:-7.309},{n:'Knockagh Rise, Carrickfergus',lat:54.715,lng:-5.806}];
const W=[
{id:1,n:'Amara Okafor',role:'Nurse',lat:54.60,lng:-5.90,pay:26,rating:4.9,ot:98,c:[200,40,120,15]},
{id:2,n:'Daniel Reyes',role:'Nurse',lat:54.52,lng:-6.05,pay:25,rating:4.7,ot:95,c:[300,90,150,220]},
{id:3,n:'Grace Mensah',role:'Nurse',lat:54.72,lng:-6.22,pay:27,rating:4.8,ot:97,c:[45,250,300,365]},
{id:4,n:'Tunde Bello',role:'HCA',lat:54.18,lng:-6.34,pay:15,rating:4.6,ot:91,c:[180,25,260,100]},
{id:5,n:'Priya Nair',role:'HCA',lat:54.99,lng:-7.31,pay:15,rating:4.9,ot:99,c:[-12,200,330,140]},
{id:6,n:'Liam Walsh',role:'HCA',lat:54.66,lng:-5.67,pay:14,rating:4.3,ot:88,c:[260,300,null,50]},
{id:7,n:'Sofia Costa',role:'HCA',lat:55.13,lng:-6.66,pay:15,rating:4.5,ot:93,c:[330,10,200,180]}];
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
W.forEach(w=>{w.c=w.c.map(x=>x==null?null:D(x));w.h=[];for(let i=0;i<56;i++){w.h.push(rnd()<(w.role=='Nurse'?.55:.65)?(rnd()<.5?6:12):0)}});
const SH=[
{id:1,site:0,role:'Nurse',date:D(1),t:'Day 08:00–20:00',w:1,st:'accepted'},
{id:2,site:1,role:'HCA',date:D(2),t:'Morning 08:00–14:00',w:4,st:'offered'},
{id:3,site:2,role:'HCA',date:D(3),t:'Night 20:00–08:00',w:null,st:'open'},
{id:4,site:3,role:'Nurse',date:D(2),t:'Night 20:00–08:00',w:2,st:'offered'}];
const TPL=[{id:1,site:0,role:'Nurse',t:'Day 08:00–20:00'},{id:2,site:1,role:'HCA',t:'Morning 08:00–14:00'},{id:3,site:2,role:'HCA',t:'Night 20:00–08:00'},{id:4,site:5,role:'HCA',t:'Afternoon 14:00–20:00'}];
const TOWNS=[['Belfast',54.597,-5.930],['Lisburn',54.512,-6.046],['Newry',54.176,-6.339],['Derry/Londonderry',54.996,-7.309],['Ballymena',54.864,-6.281],['Bangor',54.660,-5.668],['Carrickfergus',54.715,-5.806],['Antrim',54.719,-6.217],['Coleraine',55.133,-6.667],['Omagh',54.598,-7.299],['Enniskillen',54.344,-7.634],['Armagh',54.350,-6.653],['Craigavon',54.447,-6.387],['Newtownards',54.591,-5.696],['Larne',54.858,-5.823],['Dungannon',54.504,-6.767],['Strabane',54.827,-7.463],['Downpatrick',54.328,-5.716],['Cookstown',54.642,-6.745],['Ballymoney',55.071,-6.511]];
const CO={n:'Carrik Care LTD',reg:'NI 632469',addr:'',tel:'07706748150',em:'timesheets@carrik.care',pay:'',vat:0,terms:14,logo:null,lr:1},INVS=[];
let nid=100;
const rt=s=>{const r=S[s.site].r;return r?r[s.role]:bill(s.role)};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtY=d=>fmt(d)+' '+d.getFullYear();
const m2=x=>CUR+x.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
let st={qd:iso(D(1)),v:'agency',tab:'shifts',sel:null,me:2,open:null,form:false};
const cs=d=>d==null?'missing':days(d)<0?'expired':days(d)<=60?'expiring':'ok';
const csLabel=d=>d==null?'Not uploaded':days(d)<0?'Expired '+fmt(d):days(d)<=60?'Expires '+fmt(d)+' ('+days(d)+' days)':'Valid to '+fmt(d);
const worst=w=>Math.max(...w.c.map(d=>({ok:0,expiring:1,expired:2,missing:3}[cs(d)])));
const eligible=(w,role,date)=>w.role==role&&w.c.every(d=>d&&d>=date);
const issues=()=>W.reduce((n,w)=>n+w.c.filter(d=>cs(d)!='ok').length,0);
const wname=id=>W.find(x=>x.id==id);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function go(v){st.v=v;st.tab=v=='agency'?'shifts':'offers';st.open=null;st.sel=null;st.sign=null;render()}
function tab(t){st.tab=t;st.sel=null;render()}
function render(){
 const a=st.v=='agency',n=issues();
 $('#seg').innerHTML=['agency','worker'].map(v=>`<button class="${st.v==v?'on':''}" onclick="go('${v}')">${v=='agency'?'Agency':'Worker'}</button>`).join('');
 const tabs=a?[['shifts','Shifts'],['team','Onboarding'+(n?' ('+n+')':'')],['map','Map'],['stats','Insights'],['inv','Invoices']]:[];
 $('#tabs').innerHTML=tabs.map(([k,l])=>`<button class="${st.tab==k?'on':''}" onclick="tab('${k}')">${l}</button>`).join('');
 $('#tabs').style.display=a?'flex':'none';
 $('#main').innerHTML=({shifts:shiftsV,team:teamV,map:mapV,stats:statsV,inv:invV,offers:offersV})[st.tab]();
 if(st.tab=='shifts')updW();if(st.sign)initSig();
}
/* ---- shifts ---- */
function shiftsV(){
 const list=SH.slice().sort((a,b)=>a.date-b.date).map(s=>{const si=S[s.site],w=wname(s.w);
 return `<div class="card"><div class="row"><div><b>${si.n}</b><small>${s.role} · ${fmt(s.date)} · ${s.t}</small></div><i class="chip ${so(s)}">${LBL[so(s)]}</i></div>
 <small>${w?w.n+' · '+km(w,si).toFixed(1)+' km away':'No one assigned yet'}${s.in?' · in '+tm(s.in)+' ('+Math.round(s.inM)+' m from site)':''}${s.out?' · out '+tm(s.out):''}${s.sig?' · signed by '+s.rep:''}</small>${s.fails?`<small style="color:var(--bad)">${s.fails} clock attempt(s) rejected: worker not at the site</small>`:''}
 ${s.st=='open'?`<div class="acts"><button class="ghost" onclick="best(${s.id})">Send to best match</button></div>`:''}
 ${s.st=='declined'?`<div class="acts"><button class="ghost" onclick="reopen(${s.id})">Reopen shift</button></div>`:''}</div>`}).join('');
 return `<h2>Shifts</h2>${quickV()}<details class="card" ${st.form?'open':''} ontoggle="st.form=this.open"><summary>New shift</summary>
 <label>Site<select id="fs" onchange="updW()">${S.map((s,i)=>`<option value="${i}">${s.n}</option>`).join('')}</select></label>
 <label>Role<select id="fr" onchange="updW()"><option>Nurse</option><option>HCA</option></select></label>
 <label>Date<input type="date" id="fd" value="${iso(D(1))}" min="${iso(D(0))}" onchange="updW()"></label>
 <label>Time<select id="ft">${Object.keys(TIMES).map(k=>`<option>${k}</option>`).join('')}</select></label>
 <label>Send to<select id="fw"></select></label>
 <div class="acts"><button class="btn" onclick="sendShift()">Send shift</button><button class="ghost" onclick="saveTpl()">Save as template</button></div></details>${list}`;
}
function updW(){const f=$('#fw');if(!f)return;const si=S[+$('#fs').value],r=$('#fr').value,d=new Date($('#fd').value+'T00:00');
 f.innerHTML='<option value="">Leave open</option>'+W.filter(w=>w.role==r).sort((a,b)=>km(a,si)-km(b,si)).map(w=>{const ok=eligible(w,r,d);return `<option value="${w.id}" ${ok?'':'disabled'}>${w.n} · ${km(w,si).toFixed(1)} km${ok?'':' · certificate issue'}</option>`}).join('')}
function sendShift(){const w=$('#fw').value,d=new Date($('#fd').value+'T00:00');if(isNaN(d))return toast('Pick a date');
 SH.push({id:Date.now(),site:+$('#fs').value,role:$('#fr').value,date:d,t:$('#ft').value,w:w?+w:null,st:w?'offered':'open'});
 st.form=false;toast(w?'Shift sent to '+wname(+w).n:'Shift saved as open');render()}
function assign(s){const si=S[s.site];
 const el=W.filter(w=>eligible(w,s.role,s.date)&&!(s.no||[]).includes(w.id)&&!SH.some(x=>x!==s&&x.w==w.id&&+x.date==+s.date&&(x.st=='offered'||x.st=='accepted'))).sort((a,b)=>km(a,si)-km(b,si));
 if(!el.length)return null;s.w=el[0].id;s.st='offered';return el[0]}
function best(id){const w=assign(SH.find(x=>x.id==id));toast(w?'Sent to '+w.n:'No compliant worker free that day. Check Onboarding.');render()}
function mk1(q){const d=new Date(st.qd+'T00:00');if(isNaN(d))return 0;if(SH.some(x=>x.site==q.site&&x.role==q.role&&x.t==q.t&&+x.date==+d&&x.st!='declined'))return 1;
 const s={id:nid++,site:q.site,role:q.role,date:d,t:q.t,w:null,st:'open'};SH.push(s);return assign(s)?2:3}
function quick(id){toast(['Pick a date','Already created for that date','Sent to the nearest available worker','No compliant worker free. Saved as an open shift.'][mk1(TPL.find(x=>x.id==id))]);render()}
function quickAll(){const c=[0,0,0,0];TPL.forEach(q=>c[mk1(q)]++);toast(c[2]+' sent, '+c[3]+' left open'+(c[1]?', '+c[1]+' already created':''));render()}
function delTpl(id){TPL.splice(TPL.findIndex(x=>x.id==id),1);render()}
function saveTpl(){const q={id:nid++,site:+$('#fs').value,role:$('#fr').value,t:$('#ft').value};
 if(TPL.some(x=>x.site==q.site&&x.role==q.role&&x.t==q.t))return toast('Template already saved');TPL.push(q);toast('Template saved');render()}
function quickV(){return `<div class="card"><div class="row"><b>Quick send</b><button class="ghost" onclick="quickAll()">Send all</button></div><label>For date<input type="date" value="${st.qd}" min="${iso(D(0))}" onchange="st.qd=this.value"></label>`+
 (TPL.length?TPL.map(q=>`<div class="cert"><span>${S[q.site].n.split(',')[0]} · ${q.role}<small>${q.t}</small></span><button class="mini" onclick="quick(${q.id})">Send</button><button class="mini" onclick="delTpl(${q.id})" aria-label="Remove template">×</button></div>`).join(''):'<small>No templates yet.</small>')+
 `<small style="margin-top:8px">Each goes to the nearest free worker with valid certificates. Add more with Save as template below.</small></div>`}
function reopen(id){const s=SH.find(x=>x.id==id);s.w=null;s.st='open';render()}
/* ---- onboarding ---- */
function renew(id,i){wname(id).c[i]=D(365);toast('Certificate marked as renewed');render()}
function teamV(){
 const n=issues(),L=[...W].sort((a,b)=>worst(b)-worst(a));
 return `<h2>Onboarding</h2>${addV()}<div class="banner ${n?'warn':'okb'}">${n?n+' certificate'+(n>1?'s':'')+' expired, expiring within 60 days or missing':'All certificates are up to date'}</div>`+
 L.map(w=>`<div class="card"><div class="row"><div><b>${w.n}</b><small>${w.role}</small></div><button class="ghost" onclick="toast('Reminder sent to ${w.n.split(' ')[0]}')">Send reminder</button></div>`+
 CERTS.map((c,i)=>{const s=cs(w.c[i]);return `<div class="cert"><span>${c}<small>${csLabel(w.c[i])}</small></span>${s=='ok'?'<i class="chip ok">Valid</i>':`<i class="chip ${s=='expiring'?'offered':'bad'}">${s=='expiring'?'Expiring':s=='expired'?'Expired':'Missing'}</i><button class="mini" onclick="renew(${w.id},${i})">Mark renewed</button>`}</div>`}).join('')+`</div>`).join('');
}
/* ---- map ---- */
function mapSVG(P,line,fixed){
 const Wd=340,Ht=280,la=P.map(p=>p.lat),ln=P.map(p=>p.lng);
 let a=Math.min(...la),b=Math.max(...la),c=Math.min(...ln),d=Math.max(...ln);
 const f=fixed?.1:.45,pa=(b-a||.01)*f,pc=(d-c||.01)*f;a-=pa;b+=pa;c-=pc;d+=pc;
 const X=p=>(p.lng-c)/(d-c)*Wd,Y=p=>Ht-(p.lat-a)/(b-a)*Ht;
 let o=`<svg viewBox="0 0 ${Wd} ${Ht}" class="map" role="img" aria-label="Schematic map"><rect width="${Wd}" height="${Ht}" fill="var(--map)"/><path d="M0 205C80 170 130 245 205 210S300 150 340 175" stroke="var(--water)" stroke-width="16" fill="none"/><path d="M50 0L125 280M0 95L340 125M225 0L265 280" stroke="var(--road)" stroke-width="4" fill="none"/><circle cx="270" cy="60" r="34" fill="var(--park)"/><circle cx="60" cy="235" r="26" fill="var(--park)"/>`;

 const gl=Object.keys(by).map(i=>{const L=by[i],tot=L.reduce((a,s)=>a+hrs(s)*rt(s),0);return `<div class="card"><div class="row"><div><b>${S[i].n}</b><small>${L.length} verified shift(s) ready to invoice</small></div><b>${money(tot)}</b></div>`+L.map(s=>`<div class="cert"><span>${wname(s.w).n}<small>${fmt(s.date)} · ${s.role} · ${hrs(s)}h · signed by ${s.rep}</small></span><button class="mini" onclick="pdf(${s.id})">Shift PDF</button></div>`).join('')+`<div class="acts"><button class="btn" onclick="createInv(${i})">Create invoice</button><button class="ghost" onclick="csv(${i})">CSV</button></div></div>`}).join('');
 const past=INVS.slice().reverse().map(v=>`<div class="cert"><span>${v.no} · ${S[v.site].n.split(',')[0]}<small>${fmt(v.date)} · ${v.ids.length} shift(s) · ${money(v.ids.reduce((a,x)=>{const s=SH.find(y=>y.id==x);return a+hrs(s)*rt(s)},0))} before VAT</small></span><button class="mini" onclick="invoicePdf(INVS.find(x=>x.no=='${v.no}'))">Download</button></div>`).join('');
 return `<h2>Invoices</h2>${pend?`<div class="banner warn">${pend} shift(s) waiting for home sign-off. Only verified shifts can be invoiced.</div>`:''}${co}`+(gl||'<div class="card"><small>Verified shifts appear here once the home representative has signed. To try it, open the Worker view, accept a shift, clock in, clock out and complete the home sign-off.</small></div>')+(past?`<h3>Past invoices</h3><div class="card">${past}</div>`:'');
}
render();
</script></body></html>
